<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="theme-color" content="#0d1117">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>عروض وخصومات</title>
<meta name="description" content="عروض وخصومات تصل إلى 50% على منتجات مختارة بعناية">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="wrap topbar__in">
    <a class="logo" href="#" id="siteName"></a>
    <nav class="chips" id="nav" aria-label="الأقسام"></nav>
    <input class="search" id="search" type="search" placeholder="ابحث عن منتج…" aria-label="بحث">
  </div>
</header>

<!-- ===== الواجهة + قايمة خصومات 50% ===== -->
<section class="hero">
  <div class="wrap">
    <h1 id="heroTitle"></h1>
    <p id="heroSub"></p>
  </div>
  <div class="wrap hot" id="hotWrap">
    <div class="hot__head"><h2 id="hotTitle"></h2></div>
    <div class="hot__row" id="hotRow"></div>
  </div>
</section>

<!-- ===== مميزات الثقة (قابلة للتعديل من products.js) ===== -->
<section class="wrap perks" id="perks"></section>

<!-- ===== الأقسام والمنتجات (بتتبني تلقائي) ===== -->
<main class="wrap" id="sections"></main>

<!-- ===== أسئلة شائعة ===== -->
<section class="wrap faq" id="faqWrap">
  <h2>أسئلة شائعة</h2>
  <div id="faq"></div>
</section>

<footer class="footer">
  <div class="wrap">
    <p id="footText"></p>
    <a class="btn btn--tg" id="footTg" target="_blank" rel="noopener">تواصل معنا على تيليجرام</a>
  </div>
</footer>

<script src="products.js"></script>
<script src="script.js"></script>
</body>
</html>
